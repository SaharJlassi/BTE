{% extends 'base.html' %}
{% block title %}{{ titre }} — KPI BTE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4" style="color: var(--bte-marine);">{{ titre }}</h2>
        <div class="card card-bte">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-bte-primary mt-2">Enregistrer</button>
                    <a href="{% url 'liste_kpi' type_kpi %}" class="btn btn-outline-secondary mt-2">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
